name: Neon PostgreSQL Automated Backup

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (Disaster Recovery weekly schedule)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del backup manual'
        required: false
        default: 'Manual on-demand backup'

concurrency:
  group: neon-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Neon Database Backup (pg_dump)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Generate Database Backup
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL or NEON_DATABASE_URL secret is not defined in repository secrets."
            exit 1
          fi

          mkdir -p backups
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          BACKUP_FILE="backups/glowstudio_neon_backup_${TIMESTAMP}.sql.gz"

          echo "Initiating pg_dump against Neon PostgreSQL..."
          pg_dump "$DB_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --quote-all-identifiers \
            | gzip -9 > "$BACKUP_FILE"

          # Verify integrity and file size
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "::error::Backup file is empty or was not created!"
            exit 1
          fi

          gzip -t "$BACKUP_FILE"
          BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
          echo "Backup created successfully: $BACKUP_FILE ($BACKUP_SIZE)"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-database-backup-${{ env.TIMESTAMP }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
